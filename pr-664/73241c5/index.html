<main><h1>#664 界面预览</h1><p class="m">commit 73241c5 · <a href="https://github.com/yetone/magpie/pull/664">回到 PR</a> · 这个 PR 在界面上看到的是「用量」页概览的数据读取方式：概览的每次读取（读者切周期/切标签触发的与定时/手动刷新触发的）现在共用同一个读取序号，只有最新一次的结果会被画出来，而且定时读取即使拿到与手上完全相同的数据，也会结束被顶掉的那次读取留下的骨架；供应商页那轮「列表还在路上」的轮询在读取或重载失败后也会重新排下一次，而不是就此停住。其余改动是 internal/plugin 的宿主读取与 CI/测试。</p>
